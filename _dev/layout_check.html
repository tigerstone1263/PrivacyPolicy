<!DOCTYPE html>
<html><head><meta charset="utf-8"></head>
<body><pre id="result">pending</pre><script>
// ?w=360&p=/zh/&scale=1.15 → 그 폭으로 페이지를 띄우고 넘치는 글자·튀어나온 배지를 JSON 으로 적는다.
const q = new URLSearchParams(location.search);
const f = document.createElement('iframe');
f.width = q.get('w') || 360; f.height = 900; f.style.border = 0;
f.src = q.get('p') || '/';
f.onload = async () => {
  const d = f.contentDocument;
  // 무한 애니메이션이 있으면 헤드리스 가상 시간이 끝나지 않는다 — 측정 중에는 끈다
  const st = d.createElement('style'); st.textContent = '*{animation:none!important;transition:none!important}'; d.head.appendChild(st);
  if (q.get('scale')) d.documentElement.style.fontSize = (100 * q.get('scale')) + '%';
  await d.fonts.ready; await new Promise(r => setTimeout(r, 400));
  const bad = [];
  const vw = d.documentElement.clientWidth;
  if (d.documentElement.scrollWidth > vw + 1) bad.push('가로 스크롤 ' + d.documentElement.scrollWidth + '>' + vw);
  for (const el of d.querySelectorAll('h1,h2,h3,p,li,td,th,summary,a,button')) {
    if (el.scrollWidth > el.clientWidth + 1 && getComputedStyle(el).display !== 'inline')
      bad.push('넘침 <' + el.tagName.toLowerCase() + '> ' + el.textContent.trim().slice(0, 30));
  }
  // 보기 버튼: 공백 없는 라벨이 두 줄이 되면(단어 중간에서 끊김) 결함
  for (const b of d.querySelectorAll('.try-options button')) {
    const t = b.textContent.trim(); const lh = parseFloat(getComputedStyle(b).lineHeight) || 20;
    const words = t.split(/\s+/).length; const lines = Math.round((b.clientHeight - parseFloat(getComputedStyle(b).paddingTop) - parseFloat(getComputedStyle(b).paddingBottom)) / lh);
    if (lines > words) bad.push('보기 버튼 글자가 단어 중간에서 끊김: ' + t + ' (' + lines + '줄)');
  }
  // 구역 사이 여백: 첫 화면을 뺀 main 의 구역은 위아래 여백이 있어야 한다
  for (const sec of d.querySelectorAll('main > section:not(#hero)')) {
    const cs = getComputedStyle(sec);
    if (parseFloat(cs.paddingTop) < 40 || parseFloat(cs.paddingBottom) < 40)
      bad.push('구역 여백 부족 #' + sec.id + ' ' + cs.paddingTop + '/' + cs.paddingBottom);
  }
  // 스토어 버튼이 화면 밖으로 나가지 않는지
  for (const btn of d.querySelectorAll('.store-btn')) {
    const r = btn.getBoundingClientRect();
    if (r.left < -1 || r.right > vw + 1) bad.push('스토어 버튼이 화면 밖 ' + Math.round(r.left) + '~' + Math.round(r.right));
  }
  document.getElementById('result').textContent = JSON.stringify(bad);
};
document.body.appendChild(f);
</script></body></html>
