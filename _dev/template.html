<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>

<header class="canvas">
  <section id="hero" class="hero wrap">
    <div class="hero-copy">
      <p class="app-name"><img src="/assets/img/app-icon.png" alt="" width="40" height="40">Absolute Ear</p>
      <h1>{{hero_title}}</h1>
      <p class="hero-sub">{{hero_sub}}</p>
      <div class="badges">{{@badges_hero}}</div>
    </div>
    <div class="hero-phone">
      <img class="phone" src="/assets/img/phone-hero.webp" alt="{{hero_phone_alt}}" width="390" height="844">
    </div>
  </section>
</header>

<main class="sheet">

  <section id="cta" class="cta wrap">
    <h2>{{hero_title}}</h2>
    <div class="badges">{{@badges_cta}}</div>
  </section>
</main>

<footer id="footer" class="footer">
  <div class="wrap footer-inner">
    <nav class="footer-links">
      <a href="/AbsoluteEarPolicy.html">{{footer_privacy}}</a>
      <a href="/termsOfService.html">{{footer_terms}}</a>
      <a href="mailto:tigerstone1263@gmail.com">{{footer_contact}}</a>
    </nav>
    <nav class="lang-switch" aria-label="Language">
      <a href="/" hreflang="ko" data-lang="ko">한국어</a>
      <a href="/en/" hreflang="en" data-lang="en">English</a>
      <a href="/zh/" hreflang="zh-Hans" data-lang="zh">中文</a>
    </nav>
    <p class="copyright">© tigerstone</p>
  </div>
</footer>

</body>
</html>
